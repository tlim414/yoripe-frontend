<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Orange-Red Gradient -->
    <linearGradient id="yoripeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6F3D" />
      <stop offset="100%" stop-color="#EF4622" />
    </linearGradient>

    <!-- Inner Bowl Shadow Gradient -->
    <linearGradient id="bowlShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B83012" />
      <stop offset="100%" stop-color="#D83C18" />
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="40" y="40" width="432" height="432" rx="105" ry="105" fill="url(#yoripeBg)" />

  <!-- Bowl Outer White Body -->
  <path d="M 145 238
           C 145 368, 367 368, 367 238
           C 325 272, 187 272, 145 238 Z"
        fill="#FFFFFF" />

  <!-- Bowl Inner Cavity (Dark Orange Shadow) -->
  <path d="M 154 240
           C 192 268, 320 268, 358 240
           C 320 252, 192 252, 154 240 Z"
        fill="url(#bowlShadow)" />

  <!-- Bowl Left Accent / Highlight Line -->
  <path d="M 182 318
           C 172 328, 192 346, 208 342"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="7"
        stroke-linecap="round" />

  <!-- Green Leaf Accent -->
  <path d="M 245 188
           C 232 145, 275 120, 282 120
           C 288 145, 262 192, 245 188 Z"
        fill="#78C25D" />

  <!-- Central 'Y' Sprout & Loop (White) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Arm -->
    <path d="M 180 152 C 202 142, 238 172, 248 218" />

    <!-- Right Arm & Teardrop Loop in Bowl -->
    <path d="M 332 152
             C 310 142, 274 172, 264 218
             C 252 265, 280 305, 256 335
             C 232 305, 244 265, 248 218" />
  </g>
</svg>
